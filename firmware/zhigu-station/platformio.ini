; PlatformIO 项目配置 - 智菇小站 ESP32-S3 (N16R8: 16MB Flash + 8MB PSRAM)
;
; ⚠ 重要: 本工程是在 Arduino IDE + esp32 core 3.3.12 下验证通过的。
;   PlatformIO 官方 espressif32 平台当前仍是 Arduino core 2.0.x，与本工程用到的
;   Serial0 / IDF 5.5 行为不完全一致；如果你用 PIO 编译，请换成基于 core 3.x 的平台
;   (pioarduino / espressif32 的 3.x 分支)，否则请直接用 Arduino IDE 编译。
;
; 与 Arduino IDE "工具" 菜单等价的设置(已实测可用):
;   Board           : ESP32S3 Dev Module
;   Flash Size      : 16MB (128Mb)
;   Partition Scheme: 16M Flash (3MB APP/9.9MB FATFS)   -> app3M_fat9M_16MB
;   Flash Mode      : QIO 80MHz
;   PSRAM           : Disabled       <- 见下方说明，开启 OPI PSRAM 时 WS2812 会崩
;   USB CDC On Boot : Disabled       <- 必须关闭，否则 Serial 跑到原生 USB 口上
;   Upload Speed    : 921600
;   Port            : /dev/cu.usbserial-xxxx (板载 CP2102 那个 "UART" 口)

[env:zhigu-s3]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- Flash ----
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.partitions = app3M_fat9M_16MB.csv

; ---- PSRAM ----
; 本模块是 ESP32-S3R8(片内 8MB *八线/OPI* PSRAM)。正确选项是 memory_type = qio_opi，
; 但实测: 开启 PSRAM(无论 opi 还是 qspi) 后，Adafruit_NeoPixel 1.15.x 的
; strip.show() (传统 RMT 驱动) 会 panic 并触发 WDT 复位，机器人在 setup() 阶段就死循环。
; 本固件目前完全没有用到 PSRAM，所以先关闭；等 LED 驱动换成新版 RMT/FastLED 后再开。
; board_build.arduino.memory_type = qio_opi
; build_flags = -DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; 不要打开下面这个：会让 Serial 绑定到原生 USB-CDC 口，
    ; 板载 CP2102(UART) 口就再也看不到任何日志。
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DBOARD_HAS_PSRAM

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit AHTX0@^2.0.4
    adafruit/Adafruit BMP280 Library@^2.6.8
    claws/BH1750@^1.3.0
